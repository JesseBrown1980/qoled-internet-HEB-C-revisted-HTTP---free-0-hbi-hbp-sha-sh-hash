name: HEB-C native Rust 1.81 full self-contained reproducibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native-repro:
    name: Native D3Q27, Host8 fixture, full receipts and replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust 1.81.0 with Clippy and rustfmt
        run: rustup toolchain install 1.81.0 --profile minimal --component rustfmt --component clippy
      - name: Enforce native offline toolchain, zero JS/Node/V8 and no JSON runtime
        run: |
          test "$(grep -c '^channel = "1.81.0"' rust-toolchain.toml)" -eq 1
          ! find src -type f \( -name '*.js' -o -name '*.json' -o -name '*.ts' \) | grep .
          ! grep -i -E '<script|javascript:' index.html
          test -f Cargo.lock
      - name: Format strictly
        run: cargo +1.81.0 fmt --all -- --check
      - name: Rust 1.81 Clippy zero warnings
        run: cargo +1.81.0 clippy --all-targets --locked --offline -- -D warnings
      - name: Build release offline using pinned lockfile
        run: cargo +1.81.0 build --release --locked --offline
      - name: Native regression, 244-state physical SHA replay and adversarial record tests
        run: cargo +1.81.0 test --all-targets --release --locked --offline
      - name: Regenerate published physical window entirely offline
        run: |
          mkdir -p repro-output/fixture
          target/release/hebc-portal --write-host8-window repro-output/fixture/sector-000-window0.rooms
          test "$(wc -c < repro-output/fixture/sector-000-window0.rooms)" -eq 110592
          echo "2dfe7d757ecb012475806b86fcdefc602680d042db836ffbcb2bfe924f2a18ee  repro-output/fixture/sector-000-window0.rooms" | sha256sum -c -
      - name: Synthetic 243-step native execution with fresh HBP/HBI and external anchor
        run: |
          mkdir -p repro-output/synthetic
          target/release/hebc-portal --run-243 --headless --hbp repro-output/synthetic/run.hbp --hbi repro-output/synthetic/run.hbi --anchor repro-output/synthetic/run.anchor > repro-output/synthetic/stdout.hbp
          target/release/hebc-portal --verify-anchor repro-output/synthetic/run.anchor repro-output/synthetic/run.hbp repro-output/synthetic/run.hbi
          grep '42fb223a755aef7c4bbefbef87af830d1e19ed2fc64de018d9f412493f41b475' repro-output/synthetic/stdout.hbp
      - name: Physical 243-step native execution on regenerated real-byte fixture
        run: |
          mkdir -p repro-output/physical
          target/release/hebc-portal --run-243 --headless \
            --physical-input repro-output/fixture/sector-000-window0.rooms \
            --expect-input-sha 2dfe7d757ecb012475806b86fcdefc602680d042db836ffbcb2bfe924f2a18ee \
            --hbp repro-output/physical/run.hbp --hbi repro-output/physical/run.hbi \
            --anchor repro-output/physical/run.anchor > repro-output/physical/stdout.hbp
          target/release/hebc-portal --verify-anchor repro-output/physical/run.anchor repro-output/physical/run.hbp repro-output/physical/run.hbi
          grep 'd33eaf8d8d156377957a42f8536e667b46ce6f22b3cb0b0256147ea74d246426' repro-output/physical/stdout.hbp
      - name: Determinism - repeat two independent native runs
        run: |
          for mode in synthetic physical; do
            mkdir -p repro-output/replayed/$mode
            case "$mode" in
              synthetic) target/release/hebc-portal --run-243 --headless --hbp repro-output/replayed/$mode/run.hbp --hbi repro-output/replayed/$mode/run.hbi --anchor repro-output/replayed/$mode/run.anchor > /dev/null ;;
              physical) target/release/hebc-portal --run-243 --headless --physical-input repro-output/fixture/sector-000-window0.rooms --hbp repro-output/replayed/$mode/run.hbp --hbi repro-output/replayed/$mode/run.hbi --anchor repro-output/replayed/$mode/run.anchor > /dev/null ;;
            esac
            for f in run.hbp run.hbi run.anchor; do
              cmp "repro-output/$mode/$f" "repro-output/replayed/$mode/$f"
            done
          done
      - name: Detect corrupt HBP, including hash-index mismatch
        run: |
          cp -r repro-output/synthetic repro-output/corrupt
          printf X | dd of=repro-output/corrupt/run.hbp bs=1 seek=290 conv=notrunc status=none
          if target/release/hebc-portal --verify-anchor repro-output/corrupt/run.anchor repro-output/corrupt/run.hbp repro-output/corrupt/run.hbi; then
            echo "FAIL: malformed HBP accepted"; exit 1
          fi
          echo "PASS: corruption rejected"
      - name: Store full reproducible receipts and reconstructed source block
        uses: actions/upload-artifact@v4
        with:
          name: hecb-rust-181-host8-self-contained-repro
          path: repro-output/
          retention-days: 30
