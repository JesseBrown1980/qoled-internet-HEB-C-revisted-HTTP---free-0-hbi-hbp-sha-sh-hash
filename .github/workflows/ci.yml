name: HEB-C Rust 1.81 Quality Gate & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-verification:
    name: Rust 1.81.0 Strict Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.81.0 toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.81.0"
          components: rustfmt, clippy

      - name: Verify Formatting (cargo fmt --all -- --check)
        run: cargo fmt --all -- --check

      - name: Enforce Clippy Quality Gate (cargo clippy -D warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Execute Unit & Integration Tests (cargo test)
        run: cargo test --all-targets

      - name: Build Release Binary
        run: cargo build --release

      - name: Execute 243-Step Simulation & Generate Receipts
        run: cargo run --release -- --run-243

      - name: Verify Trust Anchor & Chain Receipts
        run: cargo run --release -- --verify-anchor evidence/heb_c_rust_243.anchor evidence/heb_c_rust_243.hbp evidence/heb_c_rust_243.hbi

      - name: Set up Python for Legacy Evidence Verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Evidence & Namespace Verification
        run: python tests/verify_evidence.py
