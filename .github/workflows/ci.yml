name: HEB-C native Rust 1.81 full self-contained reproducibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native-repro:
    name: Native D3Q27, Host8 fixture, full receipts and replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust 1.81.0 with Clippy and rustfmt
        run: rustup toolchain install 1.81.0 --profile minimal --component rustfmt --component clippy
      - name: Enforce native offline toolchain, zero JS/Node/V8 and no JSON runtime
        run: |
          test "$(grep -c '^channel = "1.81.0"' rust-toolchain.toml)" -eq 1
          ! find src -type f \( -name '*.js' -o -name '*.json' -o -name '*.ts' \) | grep .
          ! grep -i -E '<script|javascript:' index.html
          test -f Cargo.lock
      - name: Verify preserved original Asolaria lawbook byte identity and every later law variant
        run: |
          test "$(git hash-object canon/COMBINED-BOOK-OF-LAWS.original.md)" = "82b3fe3e833ab34a21451e57f4fb9b0a8d5304f5"
          test "$(grep -c '^## BEGIN IMMUTABLE SOURCE' canon/RIME_LAWS_58_TO_71_SOURCE_SNAPSHOTS.md)" -eq 15
          grep -F 'Original Git blob SHA-1: ae05ff790b1c8ce76564d58f5a9dbc95405092d8' canon/RIME_LAWS_58_TO_71_SOURCE_SNAPSHOTS.md
          grep -F 'Original Git blob SHA-1: 24e5e8837e40804a19bb0bf5048985c179d35272' canon/RIME_LAWS_58_TO_71_SOURCE_SNAPSHOTS.md
          echo "PASS: 710577-byte original compiled lawbook and all 15 standalone 58-71 source variants preserved"
      - name: Format strictly
        run: cargo +1.81.0 fmt --all -- --check
      - name: Rust 1.81 Clippy zero warnings
        run: cargo +1.81.0 clippy --all-targets --locked --offline -- -D warnings
      - name: Build release offline using pinned lockfile
        run: cargo +1.81.0 build --release --locked --offline
      - name: Native regression, 244-state physical SHA replay and adversarial record tests
        run: cargo +1.81.0 test --all-targets --release --locked --offline
      - name: Verify Asolaria source-pinned fabric and deterministic 3D vowel shapes
        run: |
          target/release/hebc-portal --fabric-build repro-output/fabric
          target/release/hebc-portal --fabric-verify repro-output/fabric
          target/release/hebc-portal --fabric-catalog > repro-output/fabric/catalog.stdout
          target/release/hebc-portal --vowel-shape A > repro-output/fabric/vowel-A.hbp
          target/release/hebc-portal --vowel-shape O > repro-output/fabric/vowel-O.hbp
          target/release/hebc-portal --vowel-shape I > repro-output/fabric/vowel-I.hbp
          target/release/hebc-portal --vowel-shape E > repro-output/fabric/vowel-E.hbp
          grep -F 'MODEL|format=GGUF' repro-output/fabric/catalog.stdout
          grep -F 'speech_synthesis=NOT_VALIDATED' repro-output/fabric/vowel-A.hbp
          cp -r repro-output/fabric repro-output/fabric-bad
          printf X | dd of=repro-output/fabric-bad/catalog.hbp bs=1 seek=50 conv=notrunc status=none
          if target/release/hebc-portal --fabric-verify repro-output/fabric-bad; then exit 1; fi
          echo "PASS: pinned constellation catalog, HBI/HBP replay, model fail-closed and vowel templates"
      - name: Regenerate published physical window entirely offline
        run: |
          mkdir -p repro-output/fixture
          target/release/hebc-portal --write-host8-window repro-output/fixture/sector-000-window0.rooms
          test "$(wc -c < repro-output/fixture/sector-000-window0.rooms)" -eq 110592
          echo "2dfe7d757ecb012475806b86fcdefc602680d042db836ffbcb2bfe924f2a18ee  repro-output/fixture/sector-000-window0.rooms" | sha256sum -c -
      - name: Synthetic 243-step native execution with fresh HBP/HBI and external anchor
        run: |
          mkdir -p repro-output/synthetic
          target/release/hebc-portal --run-243 --headless --hbp repro-output/synthetic/run.hbp --hbi repro-output/synthetic/run.hbi --anchor repro-output/synthetic/run.anchor > repro-output/synthetic/stdout.hbp
          target/release/hebc-portal --verify-anchor repro-output/synthetic/run.anchor repro-output/synthetic/run.hbp repro-output/synthetic/run.hbi
          grep '42fb223a755aef7c4bbefbef87af830d1e19ed2fc64de018d9f412493f41b475' repro-output/synthetic/stdout.hbp
      - name: Physical 243-step native execution on regenerated real-byte fixture
        run: |
          mkdir -p repro-output/physical
          target/release/hebc-portal --run-243 --headless \
            --physical-input repro-output/fixture/sector-000-window0.rooms \
            --expect-input-sha 2dfe7d757ecb012475806b86fcdefc602680d042db836ffbcb2bfe924f2a18ee \
            --hbp repro-output/physical/run.hbp --hbi repro-output/physical/run.hbi \
            --anchor repro-output/physical/run.anchor > repro-output/physical/stdout.hbp
          target/release/hebc-portal --verify-anchor repro-output/physical/run.anchor repro-output/physical/run.hbp repro-output/physical/run.hbi
          grep 'd33eaf8d8d156377957a42f8536e667b46ce6f22b3cb0b0256147ea74d246426' repro-output/physical/stdout.hbp
      - name: Determinism - repeat two independent native runs
        run: |
          for mode in synthetic physical; do
            mkdir -p repro-output/replayed/$mode
            case "$mode" in
              synthetic) target/release/hebc-portal --run-243 --headless --hbp repro-output/replayed/$mode/run.hbp --hbi repro-output/replayed/$mode/run.hbi --anchor repro-output/replayed/$mode/run.anchor > /dev/null ;;
              physical) target/release/hebc-portal --run-243 --headless --physical-input repro-output/fixture/sector-000-window0.rooms --hbp repro-output/replayed/$mode/run.hbp --hbi repro-output/replayed/$mode/run.hbi --anchor repro-output/replayed/$mode/run.anchor > /dev/null ;;
            esac
            for f in run.hbp run.hbi run.anchor; do
              cmp "repro-output/$mode/$f" "repro-output/replayed/$mode/$f"
            done
          done
      - name: Detect corrupt HBP, including hash-index mismatch
        run: |
          cp -r repro-output/synthetic repro-output/corrupt
          printf X | dd of=repro-output/corrupt/run.hbp bs=1 seek=290 conv=notrunc status=none
          if target/release/hebc-portal --verify-anchor repro-output/corrupt/run.anchor repro-output/corrupt/run.hbp repro-output/corrupt/run.hbi; then
            echo "FAIL: malformed HBP accepted"; exit 1
          fi
          echo "PASS: corruption rejected"
      - name: Validate published one-command Bash reproducer end-to-end
        run: bash scripts/reproduce_native.sh
      - name: Store full reproducible receipts and reconstructed source block
        uses: actions/upload-artifact@v4
        with:
          name: hecb-rust-181-host8-self-contained-repro
          path: repro-output/
          retention-days: 30

  stage2-s3-research:
    name: Pinned native Rust Yang-Mills Stage 2 research snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/yang_mills_stage2
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.81.0 with offline Clippy
        run: rustup toolchain install 1.81.0 --profile minimal --component rustfmt --component clippy
      - name: Check pinned Stage 2 source formatting
        run: cargo +1.81.0 fmt --all -- --check
      - name: Native Stage 2 integer tests and independent characteristic determinant
        run: cargo +1.81.0 test --all-targets --offline --locked
      - name: Native Stage 2 all-target Clippy zero warnings
        run: cargo +1.81.0 clippy --all-targets --offline --locked -- -D warnings
      - name: Build finite S3 headless kernel
        run: cargo +1.81.0 build --release --offline --locked
      - name: Reproduce physical Gauss Hilbert counts and certified interacting gap
        run: |
          target/release/hebc sector single | grep 'physical_hilbert_dim=3'
          target/release/hebc sector double | grep 'physical_hilbert_dim=11'
          target/release/hebc sector torus2 | grep 'physical_hilbert_dim=1393'
          target/release/hebc spectrum 1 0 | grep 'positive=1'
          target/release/hebc spectrum 1 1 | grep 'positive=1'
          target/release/hebc spectrum 3 5 | grep 'positive=1'
          target/release/hebc spectrum 0 0 | grep 'positive=0'
      - name: Reproduce 1,048,576 encoded Q-trit stress with native receipts
        run: |
          target/release/hebc run 3 512 0 ci-stress-512
          target/release/hebc verify ci-stress-512
          target/release/hebc run 3 512 0 ci-stress-512-repeat
          cmp ci-stress-512/run.hbp ci-stress-512-repeat/run.hbp
          cmp ci-stress-512/index.hbi ci-stress-512-repeat/index.hbi
          cmp ci-stress-512/run.anchor ci-stress-512-repeat/run.anchor
      - name: Store Stage 2 S3 native evidence
        uses: actions/upload-artifact@v4
        with:
          name: hecb-vendored-yang-mills-stage2-s3-repro
          path: research/yang_mills_stage2/ci-stress-512/
          retention-days: 30

  windows-cross-platform-repro:
    name: Windows Rust 1.81 reproducibility (Host8 fixture + finite S3)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Windows Rust 1.81.0
        shell: pwsh
        run: rustup toolchain install 1.81.0 --profile minimal --component rustfmt --component clippy
      - name: Native headless PowerShell one-checkout reproduction
        shell: pwsh
        run: ./scripts/reproduce_native.ps1
      - name: Preserve independently generated Windows receipts
        uses: actions/upload-artifact@v4
        with:
          name: hecb-windows-rust181-cross-platform-evidence
          path: |
            repro-output/synthetic/
            repro-output/physical/
            repro-output/ym-stress-512/
          retention-days: 30
